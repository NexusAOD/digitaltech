<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  <title>Editar Producto</title>
</head>
<body style="background-color: #F0F8FF;">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">DigitalTech</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                  <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Panel de Control</a>
                  </li>
                </ul>
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                      <a class="nav-link" href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
                    </li>
                </ul>
          </div>
        </div>
      </nav>
  <div class="container my-4">
    <h1 class="text-center mt-5">Agregar Producto</h1>
    <form method="POST" action="{{ url_for('add_product') }}">
      <div class="form-group row">
        <label for="nombre" class="col-sm-2 col-form-label">Nombre</label>
        <div class="col-sm-10">
            <input type="text" class="form-control" id="nombre" name="nombre" required>
        </div>
    </div>
    <div class="form-group row">
        <label for="marca" class="col-sm-2 col-form-label">Marca</label>
        <div class="col-sm-10">
            <input type="text" class="form-control" id="marca" name="marca" required>
        </div>
    </div>
    <div class="form-group row">
        <label for="categoria" class="col-sm-2 col-form-label">Categoría</label>
        <div class="col-sm-10">
            <select class="form-control" id="categoria" name="categoria" required>
                <option value="Accesorios">Accesorios</option>
                <option value="Periféricos">Periféricos</option>
                <option value="Computadoras">Computadoras</option>
                <option value="Componentes">Componentes</option>
                <option value="Software">Software</option>
            </select>
        </div>
    </div>
    <div class="form-group row">
        <label for="estatus" class="col-sm-2 col-form-label">Estatus</label>
        <div class="col-sm-10">
            <select class="form-control" id="estatus" name="estatus" required>
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
            </select>
        </div>
    </div>
    <div class="form-group row">
        <label for="descripcion" class="col-sm-2 col-form-label">Descripción</label>
        <div class="col-sm-10">
            <textarea class="form-control" id="descripcion" name="descripcion" rows="3"></textarea>
        </div>
    </div>
    <div class="form-group row">
        <label for="imagen" class="col-sm-2 col-form-label">Imagen</label>
        <div class="col-sm-10">
            <input type="text" class="form-control" id="imagen" name="imagen">
        </div>
    </div>
    <div class="form-group row">
        <label for="precio" class="col-sm-2 col-form-label">Precio</label>
        <div class="col-sm-10">
            <input type="number" class="form-control" id="precio" name="precio" step="0.01" required>
        </div>
    </div>
    <div class="form-group">
        <div class="col-sm-12 text-center">
            <button type="submit" class="btn btn-primary">Agregar</button>
            <a href="{{ url_for('crud_products') }}" class="btn btn-primary" style="margin-left: 1rem;">Regresar</a>
        </div>
    </div>
    </body>
</html>
