<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Agregar Empleado</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>
<body style="background-color: #F0F8FF;">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">DigitalTech</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                  <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Panel de Control</a>
                  </li>
                </ul>
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                      <a class="nav-link" href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
                    </li>
                </ul>
          </div>
        </div>
      </nav>
  <div class="container">
    <h1 class="text-center mt-5">Agregar Empleado</h1>
    <form method="POST" action="{{ url_for('add_employee') }}">
        <div class="row mb-3">
            <label for="nombre" class="col-sm-2 col-form-label">Nombre:</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="nombre" name="nombre" required>
            </div>
        </div>
        <div class="row mb-3">
          <label for="contraseña" class="col-sm-2 col-form-label">Contraseña:</label>
          <div class="col-sm-10">
              <input type="password" class="form-control" id="contraseña" name="contraseña" required>
          </div>
      </div>
        <div class="row mb-3">
            <label for="direccion" class="col-sm-2 col-form-label">Dirección:</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="direccion" name="direccion" required>
            </div>
        </div>
        <div class="row mb-3">
            <label for="correo" class="col-sm-2 col-form-label">Correo Electrónico:</label>
            <div class="col-sm-10">
                <input type="email" class="form-control" id="correo" name="correo" required>
            </div>
        </div>
        <div class="row mb-3">
            <label for="cargo" class="col-sm-2 col-form-label">Cargo:</label>
            <div class="col-sm-10">
                <select class="form-control" id="option" name="option" required>
                    <option value="Sistemas">Sistemas</option>
                    <option value="Gerente">Gerente</option>
                    <option value="Empleado">Empleado</option>
                </select>
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-sm-12 text-center">
                <button type="submit" class="btn btn-primary">Agregar</button>
                <a href="{{ url_for('crud_employees') }}" class="btn btn-primary" style="margin-left: 1rem;">Regresar</a>
            <table class="table table-striped table-bordered">
            </div>
        </div>
    </form>
  </div>
</body>
</html>
